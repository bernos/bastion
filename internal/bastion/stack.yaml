AWSTemplateFormatVersion: 2010-09-09
Description: Bastion host — private EC2 instance accessible via SSM Session Manager and EC2 Instance Connect Endpoint

Parameters:
  SubnetId:
    Description: Private subnet in which to launch the bastion instance
    Type: AWS::EC2::Subnet::Id

  VpcId:
    Description: VPC in which to create the bastion security group
    Type: AWS::EC2::VPC::Id

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  AmiId:
    Description: SSM parameter path for the bastion AMI
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  BastionName:
    Description: Name for the bastion host and associated resources
    Type: String

  Owner:
    Description: Owner tag value applied to all resources
    Type: String
    Default: ''

Resources:
  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Ref BastionName
        - Key: Owner
          Value: !Ref Owner

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionRole

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion host — no inbound rules required (SSM and EICE handle access)
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Ref BastionName
        - Key: Owner
          Value: !Ref Owner

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BastionInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref BastionSecurityGroup
          AssociatePublicIpAddress: false
      Tags:
        - Key: Name
          Value: !Ref BastionName
        - Key: Owner
          Value: !Ref Owner

Outputs:
  InstanceId:
    Value: !Ref BastionInstance
    Description: Bastion EC2 instance ID — use with aws ssm start-session or ec2-instance-connect
